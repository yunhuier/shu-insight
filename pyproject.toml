[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shu-insight"
version = "0.1.0"
description = "Local SHU notice mining and recommendation demo"
requires-python = ">=3.11,<3.13"
dependencies = [
  "streamlit>=1.64,<2",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.3,<6",
  "jieba>=0.42,<1",
  "scikit-learn>=1.5,<2",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<4"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
